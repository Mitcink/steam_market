version: '3.8'

services:
  web:
    build: .
    container_name: steam-buff-crawler
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=prod-secret-key-change-this  # 记得改这个
      - FLASK_ENV=production
    volumes:
      # 映射本地 data 目录到容器内
      # 注意：确保宿主机上的 ./data 目录对 UID 1000 可写
      - ./data:/app/data

    # 如果在 Linux 上运行遇到 Permission Denied 错误，
    # 取消下面这一行的注释，强制使用当前用户的 UID:GID
    # user: "${UID}:${GID}"