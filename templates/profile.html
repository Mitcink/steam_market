<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户资料 - 爬虫管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        .info-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            font-weight: 600;
            color: #555;
        }
        .info-value {
            color: #333;
        }
        .btn-back {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">爬虫管理系统</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-item nav-link text-white">欢迎，{{ username }}</span>
                <a class="nav-item nav-link" href="{{ url_for('index') }}">控制台</a>
                <a class="nav-item nav-link" href="{{ url_for('logout') }}">退出</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar">
                {{ username[0].upper() }}
            </div>
            <h3>{{ username }}</h3>
            <p class="text-muted">用户信息</p>
        </div>

        <div class="profile-info">
            <div class="row info-item">
                <div class="col-md-3 info-label">用户名</div>
                <div class="col-md-9 info-value">{{ username }}</div>
            </div>

            <div class="row info-item">
                <div class="col-md-3 info-label">账户创建时间</div>
                <div class="col-md-9 info-value">{{ created_at }}</div>
            </div>

            <div class="row info-item">
                <div class="col-md-3 info-label">用户类型</div>
                <div class="col-md-9 info-value">
                    {% if username == 'admin' %}
                    <span class="badge bg-danger">管理员</span>
                    {% else %}
                    <span class="badge bg-success">普通用户</span>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-back">
                <i class="fas fa-arrow-left"></i> 返回控制台
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
