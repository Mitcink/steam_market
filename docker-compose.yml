version: '3.8'

services:
  web:
    build: .
    container_name: steam-buff-crawler
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1  # 关键：强制 Python 实时刷新日志，不再缓冲
    volumes:
      - ./data:/app/data
    # 覆盖启动命令：1个进程，10个并发线程
    command: gunicorn --workers 1 --threads 10 --bind 0.0.0.0:5000 --access-logfile - --error-logfile - app:app